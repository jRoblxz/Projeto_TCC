worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;

events {
    worker_connections  4096;
}

http {
    include       $!{nginx}/conf/mime.types;
    default_type  application/octet-stream;

    # 1. ARMADURA DO TAMANHO: Permite uploads até 500MB (Obrigatório para vídeos)
    client_max_body_size 500M;
    
    # 2. ARMADURA DA MEMÓRIA: Permite que o Nginx use mais memória para o upload antes de escrever no disco
    client_body_buffer_size 128M;

    # 3. ARMADURA DO TEMPO (TIMEOUT): O upload de vídeos demora. Sem isto, o Railway desliga a ficha aos 60s!
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    fastcgi_send_timeout  600s;
    fastcgi_read_timeout  600s;
    keepalive_timeout     600s;

    server {
        listen ${PORT};
        
        # O Laravel serve a partir da pasta public
        root /app/public;

        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            # O Railway usa a porta 9000 internamente para comunicar entre Nginx e PHP
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            
            # Repete o aumento do timeout aqui para o PHP não desistir
            fastcgi_read_timeout 600;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}